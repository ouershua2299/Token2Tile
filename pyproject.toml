[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "token2tile"
version = "0.1.0"
description = "Token2Tile: training-free sparse attention for video diffusion transformers"
requires-python = ">=3.10"
dependencies = ["torch", "triton"]

[tool.setuptools]
packages = ["token2tile"]

[tool.setuptools.package-data]
token2tile = ["operator/*.py", "operator/kernels/*/src/*"]
